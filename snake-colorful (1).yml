name: generate animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark
            dist/snake-ocean.svg?color_snake=#00b4d8&color_dots=#0077b6,#00b4d8,#90e0ef,#caf0f8
            dist/snake-sunset.svg?color_snake=#ff6b6b&color_dots=#ffe66d,#ff9f1c,#ff6b6b,#c1121f
            dist/snake.gif?color_snake=orange&color_dots=#c9e6ff,#a2d1ff,#78bbff,#4da2ff

      - name: push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
